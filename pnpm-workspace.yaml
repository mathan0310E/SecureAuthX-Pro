packages:
  - "apps/*"
  - "packages/*"
  - "tests/*"

allowBuilds:
  esbuild: true
  workerd: true

minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20260801.1'
  - miniflare@5.20260730.0-alpha
  - wrangler@4.118.0

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "@prisma/query-engine-wasm"
  - "bcrypt"
  - "esbuild"
  - "prisma"
  - "sharp"
  - "unrs-resolver"
