name: Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vercel-deploy
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @secureauthx/database exec prisma generate

      - name: Pull project env
        run: pnpm dlx vercel@latest pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build
        run: pnpm dlx vercel@latest build --yes --prod --token=$VERCEL_TOKEN

      - name: Deploy to Production
        run: pnpm dlx vercel@latest deploy --prebuilt --yes --prod --token=$VERCEL_TOKEN

  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @secureauthx/database exec prisma generate

      - name: Pull project env
        run: pnpm dlx vercel@latest pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build
        run: pnpm dlx vercel@latest build --yes --prod --token=$VERCEL_TOKEN

      - name: Deploy to Production
        run: pnpm dlx vercel@latest deploy --prebuilt --yes --prod --token=$VERCEL_TOKEN
