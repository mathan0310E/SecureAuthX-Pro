name: Recover Neon DATABASE_URL from Vercel

# One-shot utility: copies the API project's production DATABASE_URL from the
# Vercel dashboard env into the GitHub Actions secret DATABASE_URL, so the
# Cloudflare Worker can reach the Neon database. Never prints the value.
on:
  workflow_dispatch:

permissions:
  contents: read
  secrets: write

jobs:
  recover:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Pull production env from Vercel API project
        run: pnpm dlx vercel@latest pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Set DATABASE_URL GitHub secret from pulled env
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ENVFILE=".vercel/.env.production.local"
          [ -f "$ENVFILE" ] || { echo "::error::pulled env file not found at $ENVFILE"; exit 1; }
          DBURL=$(grep '^DATABASE_URL=' "$ENVFILE" | head -1 | cut -d= -f2- | tr -d '\r"')
          [ -n "$DBURL" ] || { echo "::error::DATABASE_URL empty in pulled env"; exit 1; }
          case "$DBURL" in
            *neon.tech*|*neon.build*|postgres://*|postgresql://*) ;;
            *) echo "::error::unexpected DATABASE_URL value"; exit 1 ;;
          esac
          printf %s "$DBURL" | gh secret set DATABASE_URL
          HOST=$(printf %s "$DBURL" | sed -E 's|postgres(ql)?://[^@]+@||; s|/.*$||')
          echo "DATABASE_URL secret updated (host: $HOST)"
