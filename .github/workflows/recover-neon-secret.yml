name: Recover Neon DATABASE_URL from Vercel

# One-shot utility: pulls the API project's production env from the Vercel
# dashboard, then (1) uploads the real Neon DATABASE_URL to the Cloudflare
# Worker as a secret, and (2) writes it to an artifact so an operator can
# restore the GitHub DATABASE_URL secret (GITHUB_TOKEN can no longer manage
# secrets, so this cannot be done in-run). Never prints the value.
on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Pull production env from Vercel API project
        run: pnpm dlx vercel@latest pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Extract DATABASE_URL from pulled env
        id: extract
        run: |
          ENVFILE=".vercel/.env.production.local"
          [ -f "$ENVFILE" ] || { echo "::error::pulled env file not found at $ENVFILE"; exit 1; }
          DBURL=$(grep '^DATABASE_URL=' "$ENVFILE" | head -1 | cut -d= -f2- | tr -d '\r"')
          [ -n "$DBURL" ] || { echo "::error::DATABASE_URL empty in pulled env"; exit 1; }
          case "$DBURL" in
            *neon.tech*|*neon.build*|postgres://*|postgresql://*) ;;
            *) echo "::error::unexpected DATABASE_URL value"; exit 1 ;;
          esac
          printf %s "$DBURL" > /tmp/database_url.txt
          echo "Wrote DATABASE_URL to /tmp/database_url.txt ($(wc -c < /tmp/database_url.txt) bytes)"

      - name: Upload DATABASE_URL to Cloudflare Worker secret
        run: |
          pnpm dlx wrangler@4 secret put DATABASE_URL < /tmp/database_url.txt
        working-directory: apps/api

      - name: Upload artifact for GitHub secret restore
        uses: actions/upload-artifact@v4
        with:
          name: database-url
          path: /tmp/database_url.txt
          if-no-files-found: error
